<!DOCTYPE html>

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230d1117'/%3E%3Crect x='2.5' y='2.5' width='59' height='59' rx='12' fill='none' stroke='%2358a6ff' stroke-width='3'/%3E%3Ctext x='32' y='44' font-family='Arial,sans-serif' font-size='32' font-weight='bold' text-anchor='middle' fill='%2358a6ff'%3EVA%3C/text%3E%3C/svg%3E">
<title>Contatos · Venda Ativa</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  .ctrls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px;}
  .grid{display:grid;grid-template-columns:1.05fr 1fr;gap:16px;align-items:start;}
  @media(max-width:880px){.grid{grid-template-columns:1fr;}}
  .row{background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:7px;display:flex;align-items:center;gap:10px;cursor:pointer;}
  .row:hover{border-color:#3d4757;}.row.sel{border-color:var(--blue);}
  .row .main{flex:1;min-width:0;}
  .row .nm{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .row .meta{font-size:12px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .bk{font-size:11px;padding:2px 8px;border-radius:999px;white-space:nowrap;}
  .bk0{background:rgba(248,81,73,.18);color:#ff7b72;}.bk1{background:rgba(63,185,80,.15);color:#56d364;}
  .bk2{background:rgba(219,109,75,.18);color:#f0a48a;}.bk3{background:rgba(88,166,255,.15);color:#79c0ff;}
  .bk4{background:rgba(163,113,247,.18);color:#b392f0;}
  .bk5{background:rgba(210,153,34,.18);color:#e3b341;}.bk6{background:rgba(139,148,158,.18);color:#a9b1ba;}
  .wa{color:var(--green);font-size:15px;}
  .skip{font-size:11px;padding:4px 9px;border-radius:7px;border:1px solid var(--border);background:transparent;color:var(--muted2);white-space:nowrap;}
  .skip:hover{border-color:#d29922;color:#e3b341;}
  .mopt{display:block;width:100%;text-align:left;font-size:13px;padding:10px 12px;border-radius:8px;border:1px solid var(--border);background:var(--panel2);color:var(--text);margin-bottom:7px;cursor:pointer;}
  .mopt:hover{border-color:var(--blue);}
  .mopt .d{font-size:11px;color:var(--muted);margin-top:2px;}
  .pop{position:fixed;z-index:70;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:8px;width:264px;box-shadow:0 8px 24px rgba(1,4,9,.6);}
  .pop .mopt{margin-bottom:5px;padding:8px 10px;}
  .sextaB{background:rgba(88,166,255,.10);border:1px solid rgba(88,166,255,.35);border-radius:10px;padding:11px 14px;font-size:13px;margin-bottom:14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .sextaB a{color:var(--blue);font-weight:600;text-decoration:underline;}
  .sextaB .x{margin-left:auto;background:none;border:none;color:var(--muted2);font-size:16px;}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:11px 16px;font-size:13px;color:var(--text);box-shadow:0 8px 24px rgba(1,4,9,.6);opacity:0;pointer-events:none;transition:opacity .2s;z-index:60;}
  .toast.on{opacity:1;pointer-events:auto;}
  .toast button{margin-left:10px;background:none;border:none;color:var(--blue);text-decoration:underline;font-size:13px;padding:0;}
  .fhead{display:flex;align-items:center;gap:11px;flex-wrap:wrap;}
  .avatar{width:40px;height:40px;border-radius:50%;background:rgba(88,166,255,.18);color:var(--blue);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:14px;}
  .tag{font-size:11px;padding:2px 8px;border-radius:999px;background:var(--panel2);color:var(--muted);border:1px solid var(--border);}
  .phones{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;margin-top:10px;}.phones .pri{color:var(--blue);}.phones .alt{color:var(--muted);}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:13px;}@media(max-width:520px){.two{grid-template-columns:1fr;}}
  .sec .t{font-size:12px;color:var(--muted2);margin-bottom:5px;}.sec .c{font-size:13px;line-height:1.7;border-top:1px solid var(--border);padding-top:8px;}
  .inputs{margin-top:14px;background:rgba(88,166,255,.08);border:1px solid rgba(88,166,255,.3);border-radius:10px;padding:12px 14px;}
  .inputs .cap{font-size:12px;color:var(--blue);font-weight:600;margin-bottom:10px;}
  .ig{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;}.ig .l{font-size:12px;color:var(--muted);margin-bottom:4px;}
  .inputs input{width:100%;}
  .stepper{display:flex;align-items:center;gap:8px;}.stepper button{width:28px;height:28px;border-radius:7px;border:1px solid var(--border);background:var(--panel2);color:var(--text);font-size:16px;}.stepper .n{font-size:18px;font-weight:600;min-width:16px;text-align:center;}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px;}.chip{font-size:12px;padding:4px 10px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--muted);}.chip.on{border-color:var(--blue);color:var(--blue);}
  .fa{margin-top:13px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;}.saved{font-size:12px;color:var(--green);opacity:0;transition:opacity .2s;}.saved.on{opacity:1;}
  .overlay{position:fixed;inset:0;background:rgba(1,4,9,.7);display:none;align-items:flex-start;justify-content:center;z-index:50;padding:40px 16px;overflow-y:auto;}.overlay.on{display:flex;}
  .modal{background:var(--panel);border:1px solid var(--border);border-radius:14px;width:100%;max-width:640px;}
  .mhead{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 18px;border-bottom:1px solid var(--border);}
  .close{width:32px;height:32px;border-radius:8px;border:1px solid var(--border);background:var(--panel2);color:var(--text);font-size:18px;}
  .mbody{padding:16px 18px 22px;}.kv{font-size:13px;line-height:1.9;}.kv b{color:var(--muted);font-weight:400;display:inline-block;min-width:140px;}
  .banner{padding:9px 13px;border-radius:8px;font-size:13px;margin-bottom:12px;}.banner.err{background:rgba(248,81,73,.12);color:#ff7b72;}.banner.ok{background:rgba(63,185,80,.12);color:#56d364;}
</style>
</head>
<body>
<div class="va-content">
  <div class="va-h1">Contatos</div>
  <div class="va-sub" id="sub"></div>
  <div class="ctrls">
    <select id="selVend"></select>
    <select id="selSeg">
      <option value="">Todos os segmentos</option>
      <option>Linha Box</option><option>Grampos Industriais</option><option>Pinos</option>
      <option>Pregos</option><option>Alicates</option><option>Diversos</option>
    </select>
    <input id="q" type="text" placeholder="Buscar empresa…" autocomplete="off" style="width:200px;">
    <button class="btn" onclick="carregar()">Atualizar</button>
  </div>
  <div id="banner"></div>
  <div id="sexta"></div>
  <div class="mrow" id="metrics"></div>
  <div class="grid">
    <div class="card"><div id="lista"><div class="empty">—</div></div></div>
    <div class="card"><div id="fichaVazia" class="empty">Selecione um contato na fila.</div><div id="ficha" style="display:none;"></div></div>
  </div>
</div>
<div class="toast" id="toast"></div>
<div class="overlay" id="overlay" onclick="if(event.target===this)fecharModal()">
  <div class="modal"><div class="mhead"><div style="font-size:16px;font-weight:600;" id="mTitle">Detalhes</div>
    <button class="close" onclick="fecharModal()">×</button></div><div class="mbody" id="mBody"></div></div>
</div>

<script src="app.js"></script>
<script>
var u = VA.montar("contatos.html");
if(u){
  var sb=VA.sb, brl=VA.brl, waNum=VA.waNum, esc=VA.esc;
  var BK={0:["Compromisso","bk0"],1:["Recompra","bk1"],2:["Reativar","bk2"],3:["Lead novo","bk3"],4:["Prospect","bk4"],5:["Toow ativo","bk5"],6:["Toow inativo","bk6"]};
  var fila=[], sel=null, currentFicha=null;
  // Estado da fila interativa: POOL = candidatos rankeados (pós-piso) por categoria;
  // PTR = quantos de cada já entraram na tela (o resto é "banco" pra reposição).
  // META = sugestões-alvo do dia; FEITAS = contatos reais já registrados hoje.
  var POOL={comp:[],recompra:[],reativar:[],lead:[]}, PTR={recompra:0,reativar:0,lead:0};
  var META=30, FEITAS=0, SNOOZE_DIAS=3;
  // RECUSA: vendedor recusa a sugestão e ensina o motivo. Janelas por motivo (dias fora da fila):
  // ticket_baixo=90, timing_errado=15, outro=30, segmento_ruim_hoje=só hoje, nao_quero_lead=DEFINITIVO.
  // Aprendizado imediato no ranking: ticket_baixo penaliza a faixa de valor recusada (mesma categoria);
  // segmento_ruim_hoje penaliza o segmento no resto do dia. Penalidade é SOFT (score), o piso segue HARD.
  var RECUSA_DIAS={ticket_baixo:90,timing_errado:15,outro:30};
  var PEN_TICKET=25, PEN_SEG=20;
  var REC={excl:{},segHoje:{},ticketMax:{recompra:0,reativar:0,lead:0}};
  var MOTIVOS={ticket_baixo:"Ticket baixo",nao_quero_lead:"Não quero lead",timing_errado:"Timing errado",segmento_ruim_hoje:"Segmento ruim para hoje",outro:"Outro motivo"};
  var $=function(s){return document.querySelector(s);};
  function banner(m,t){ $("#banner").innerHTML = m?'<div class="banner '+t+'">'+m+'</div>':""; }

  // Pesos da fila (va_parametros) — ranqueiam a fila por vendedor
  var PARAMS={};
  function pvObj(obj,V,flatKeys,def){
    if(obj&&obj[V]) return obj[V];
    if(obj&&flatKeys.some(function(k){return obj[k]!=null;})) return obj;
    return def;
  }
  function num(x,d){ return (x==null||isNaN(x))?d:Number(x); }
  // ORDEM DOS CRITÉRIOS: 1º Meta (tamanho) → 2º Mistura (composição, vira cota em montarFila)
  // → 3º Ranking (timing/valor/já-cliente, ABAIXO) → 4º Segmento (último, nudge mais leve: sW*2).
  // A Mistura NÃO entra na pontuação — ela é cota. Aqui só ordenamos DENTRO de cada categoria.
  function pontuar(rows,V){
    var rank=pvObj(PARAMS.pesos_ranking,V,["timing","valor","ja_cliente"],{timing:40,valor:30,ja_cliente:15});
    var seg=(PARAMS.pesos_segmento&&PARAMS.pesos_segmento[V])||{};
    // valorS = POSIÇÃO PERCENTUAL do cliente entre todos da fila (rank), não razão pelo maior.
    // Antes: valor/maxGlobal — com um cliente gigante no topo (R$95k–318k), R$300 e R$3.000
    // empatavam perto de zero e o valor sumia do ranking. Agora cada faixa se separa de fato.
    var sv=rows.map(function(f){return f.valor_ref||0;}).sort(function(a,b){return a-b;});
    var N=sv.length;
    function pct(v){ if(N<=1)return 1; var lo=0,hi=N; while(lo<hi){var m=(lo+hi)>>1; if(sv[m]<v)lo=m+1; else hi=m;} return lo/(N-1); }
    rows.forEach(function(f){
      var valorS=pct(f.valor_ref||0);
      var timingS=Math.max(0,Math.min(1,((f.dias||0)+30)/60));
      var jaS=(f.status==="cliente")?1:0;
      var sW=seg[f.segmento_primario]||0;        // segmento = critério final, peso menor que o ranking
      f._score=(rank.timing||0)*timingS+(rank.valor||0)*valorS+(rank.ja_cliente||0)*jaS+sW*2;
      if(REC.segHoje[f.segmento_primario]) f._score-=PEN_SEG;   // recusa "segmento ruim para hoje": segmento desce no dia
    });
  }
  // distribui R vagas entre recompra/reativar/lead conforme a Mistura,
  // respeitando quantos existem; sobra de uma categoria curta vai pras outras.
  function distribuir(R,mix,avail){
    var cats=["recompra","reativar","lead"], w={}, tot=0;
    cats.forEach(function(c){ w[c]=Math.max(0,mix[c]||0); tot+=w[c]; });
    if(tot<=0){ cats.forEach(function(c){ w[c]=1; }); tot=3; }
    var alloc={}, rema={}, used=0;
    cats.forEach(function(c){ var ideal=R*w[c]/tot; var base=Math.min(avail[c],Math.floor(ideal)); alloc[c]=base; rema[c]=ideal-Math.floor(ideal); used+=base; });
    var left=R-used, guard=0;
    while(left>0 && guard<5000){
      var order=cats.slice().sort(function(a,b){ return rema[b]-rema[a]; });
      var moved=false;
      for(var i=0;i<order.length && left>0;i++){ var c=order[i]; if(alloc[c]<avail[c]){ alloc[c]++; left--; rema[c]=0; moved=true; } }
      if(!moved) break; guard++;
    }
    return alloc;
  }
  // intercala as listas (peso por tamanho) pra dar variedade de cima a baixo
  function intercalar(parts){
    var cats=Object.keys(parts), idx={}, credit={}, weights={}, wsum=0, total=0;
    cats.forEach(function(c){ idx[c]=0; credit[c]=0; weights[c]=parts[c].length; wsum+=weights[c]; total+=parts[c].length; });
    var out=[];
    while(out.length<total){
      var best=null;
      cats.forEach(function(c){ if(idx[c]<parts[c].length){ credit[c]+=weights[c]; if(best===null||credit[c]>credit[best]) best=c; } });
      if(best===null) break;
      out.push(parts[best][idx[best]++]); credit[best]-=wsum;
    }
    return out;
  }
  // monta a fila final: compromissos no topo + cota da Mistura sobre a meta diária.
  // Categorias da Mistura: Recompra=balde 1; Reativar=balde 2 (ex-clientes) + balde 4 (prospects);
  // Lead=balde 3. Toow (5/6) NÃO entra aqui — fica nos filtros da listagem.
  function acima(arr,minV){ return arr.filter(function(f){ return (f.valor_ref||0)>=(minV||0); }); }
  function montarFila(pool,V){
    pontuar(pool,V);
    var byB={0:[],1:[],2:[],3:[],4:[]};
    pool.forEach(function(f){ if(byB[f.bucket]) byB[f.bucket].push(f); });
    // PISO DURO de valor por categoria (va_parametros.pisos_valor, por vendedor).
    // Abaixo do piso NÃO entra na fila do dia (segue na listagem). Compromisso (balde 0) é isento.
    var piso=pvObj(PARAMS.pisos_valor,V,["recompra","reativar","lead"],{recompra:1000,reativar:1000,lead:1000});
    // Aprendizado de "ticket baixo": abaixo do maior valor recusado da categoria, o score cai (soft — piso segue hard).
    function penalTicket(arr,cat){ var T=REC.ticketMax[cat]||0; if(T>0) arr.forEach(function(f){ if((f.valor_ref||0)<=T) f._score-=PEN_TICKET; }); return arr; }
    POOL.recompra=penalTicket(acima(byB[1],piso.recompra),"recompra").sort(byScore);
    POOL.reativar=penalTicket(acima(byB[2].concat(byB[4]),piso.reativar),"reativar").sort(byScore);   // antigos + prospects
    POOL.lead=penalTicket(acima(byB[3],piso.lead),"lead").sort(byScore);
    POOL.comp=byB[0].slice().sort(byScore);   // compromissos: sem piso
    PTR={recompra:0,reativar:0,lead:0};
    if(!V){ // admin "Todos": sem cota — compromissos no topo + resto por score, teto 60
      var resto=POOL.recompra.concat(POOL.reativar,POOL.lead).sort(byScore);
      return POOL.comp.concat(resto).slice(0,60);
    }
    META=num((PARAMS.meta_diaria&&PARAMS.meta_diaria[V]),30);
    // alvo visível = meta MENOS o que já foi feito hoje. "Agora não" não desconta; só registro real desconta.
    var target=Math.max(0,META-FEITAS);
    var mix=pvObj(PARAMS.mix_fila,V,["recompra","reativar","lead"],{recompra:40,reativar:30,lead:30});
    var comp=POOL.comp;
    var slots=Math.max(0,target-comp.length);
    var avail={recompra:POOL.recompra.length,reativar:POOL.reativar.length,lead:POOL.lead.length};
    var alloc=distribuir(slots,mix,avail);
    PTR.recompra=alloc.recompra; PTR.reativar=alloc.reativar; PTR.lead=alloc.lead;   // o resto vira banco de reposição
    var parts={recompra:POOL.recompra.slice(0,alloc.recompra),reativar:POOL.reativar.slice(0,alloc.reativar),lead:POOL.lead.slice(0,alloc.lead)};
    return comp.concat(intercalar(parts));
  }
  function byScore(a,c){ return (c._score||0)-(a._score||0); }
  // categoria de uma ficha pelo balde (para repor da mesma categoria e preservar a Mistura)
  function categoria(f){ var b=f.bucket; if(b===1)return "recompra"; if(b===2||b===4)return "reativar"; if(b===3)return "lead"; if(b===0)return "comp"; return "lead"; }
  function pullFrom(cat){ if(cat&&cat!=="comp"&&PTR[cat]<POOL[cat].length){ return POOL[cat][PTR[cat]++]; } return null; }
  function nextBestAny(){ var best=null,bc=null; ["recompra","reativar","lead"].forEach(function(c){ if(PTR[c]<POOL[c].length){ var f=POOL[c][PTR[c]]; if(best===null||(f._score||0)>(best._score||0)){best=f;bc=c;} } }); if(bc){ PTR[bc]++; return best; } return null; }
  function nextRepl(prefCat){ return pullFrom(prefCat)||nextBestAny(); }
  function idxOf(doc){ for(var i=0;i<fila.length;i++){ if(fila[i].documento===doc) return i; } return -1; }
  // tira o card da tela; se repor=true, puxa o próximo melhor (mesma categoria primeiro) e mantém o alvo do dia.
  function removeReplace(doc,repor){
    var i=idxOf(doc); if(i<0) return;
    var cat=categoria(fila[i]); fila.splice(i,1);
    if(repor){ var r=nextRepl(cat==="comp"?null:cat); if(r){ fila.push(r); var vv=(u.role==="admin"?selV.value:u.nome); if(vv) logFila(vv,[r]); } }
    if(sel===doc){ sel=null; $("#ficha").style.display="none"; $("#fichaVazia").style.display="block"; }
    renderLista(); renderMetrics();
  }

  // seletor de vendedor: vendedor ve so a propria fila; admin escolhe.
  var selV=$("#selVend");
  if(u.role==="admin"){ selV.innerHTML='<option value="">Todos</option><option>Francisco</option><option>Matheus</option><option>Lorena</option>'; }
  else { selV.innerHTML='<option>'+esc(u.nome)+'</option>'; selV.value=u.nome; selV.disabled=true; }

  window.carregar=async function(){
    banner(""); $("#lista").innerHTML='<div class="empty">Carregando…</div>';
    var v=selV.value, seg=$("#selSeg").value;
    // baldes da fila do dia: compromisso(0), recompra(1), reativar(2), lead(3), prospect(4).
    // Reativar = balde 2 + balde 4. Toow(5/6) fica de fora — acessível pela listagem.
    var qy=sb.from("vw_fila").select("*").in("bucket",[0,1,2,3,4]);
    if(v) qy=qy.eq("vendedor_alvo",v);
    if(seg) qy=qy.eq("segmento_primario",seg);
    qy=qy.order("valor_ref",{ascending:false,nullsFirst:false}).limit(1000);
    var r=await qy;
    if(r.error){ banner("Erro: "+r.error.message,"err"); $("#lista").innerHTML='<div class="empty">—</div>'; return; }
    var rows=r.data||[];
    SNOOZE_DIAS=num(PARAMS.agora_nao_dias,3); FEITAS=0;
    REC={excl:{},segHoje:{},ticketMax:{recompra:0,reativar:0,lead:0}};
    if(v){
      var snz=await fetchAdiados(v); FEITAS=await fetchFeitas(v);
      rows=rows.filter(function(f){ return !snz[f.documento]; });   // tira adiados ("agora não") da janela
      await aplicarRecusas(v,rows);                                  // exclusões + aprendizado (REC)
      rows=rows.filter(function(f){ return !REC.excl[f.documento]; });
    }
    fila=montarFila(rows,v); renderLista(); renderMetrics();
    if(v) logFila(v,fila);   // registra quem a fila PROPÔS hoje (funil do relatório)
    $("#sub").textContent=new Date().toLocaleDateString("pt-BR",{weekday:"long",day:"numeric",month:"long"})+(v?" · "+v:"");
  };
  // Log das sugestões do dia (1x por cliente/vendedor/dia) — alimenta a coluna "Propostos" do relatório.
  function logFila(vend,items){
    if(!vend||!items||!items.length) return;
    var dia=new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,10);
    var rows=items.map(function(f){ return {documento:f.documento,vendedor:vend,categoria:categoria(f),bucket:f.bucket,dia:dia}; });
    sb.from("va_fila_log").upsert(rows,{onConflict:"documento,vendedor,dia",ignoreDuplicates:true}).then(function(){});
  }
  // Banner de sexta à tarde (13h–17h): convite para gerar o relatório da semana.
  (function(){
    var d=new Date();
    if(d.getDay()===5 && d.getHours()>=13 && d.getHours()<17 && !sessionStorage.getItem("va_sexta_ok")){
      $("#sexta").innerHTML='<div class="sextaB">📋 Sexta-feira — fechamento da semana! Que tal gerar seu relatório agora? '
        +'<a href="relatorios.html">Gerar relatório</a>'
        +'<button class="x" title="dispensar" onclick="this.parentNode.remove();sessionStorage.setItem(\'va_sexta_ok\',\'1\')">×</button></div>';
    }
  })();
  function inicioDoDia(){ var d=new Date(); d.setHours(0,0,0,0); return d.toISOString(); }
  async function fetchFeitas(vend){
    var r=await sb.from("va_interacoes").select("documento,resultado,data").eq("vendedor",vend).gte("data",inicioDoDia());
    var s={}; (r.data||[]).forEach(function(x){ if(x.resultado!=="agora_nao"&&x.resultado!=="recusado") s[x.documento]=1; }); return Object.keys(s).length;
  }
  async function fetchAdiados(vend){
    var since=new Date(); since.setDate(since.getDate()-SNOOZE_DIAS);
    var r=await sb.from("va_interacoes").select("documento,data").eq("vendedor",vend).eq("resultado","agora_nao").gte("data",since.toISOString());
    var s={}; (r.data||[]).forEach(function(x){ s[x.documento]=1; }); return s;
  }
  // Recusas do vendedor: janela de 90d cobre todos os motivos temporários; nao_quero_lead vem sem limite de data (definitivo).
  async function aplicarRecusas(vend,rows){
    var since=new Date(); since.setDate(since.getDate()-90);
    var r=await sb.from("va_interacoes").select("documento,motivo,data")
      .eq("vendedor",vend).eq("resultado","recusado")
      .or("motivo.eq.nao_quero_lead,data.gte."+since.toISOString());
    if(r.error||!r.data||!r.data.length) return;
    var byDoc={}; rows.forEach(function(f){ byDoc[f.documento]=f; });
    var hoje=new Date(inicioDoDia());
    r.data.forEach(function(x){
      var m=x.motivo||"outro", f=byDoc[x.documento], dx=new Date(x.data);
      if(m==="nao_quero_lead"){ REC.excl[x.documento]=1; return; }               // definitivo
      if(m==="segmento_ruim_hoje"){
        if(dx>=hoje){ REC.excl[x.documento]=1;                                    // volta amanhã
          if(f&&f.segmento_primario) REC.segHoje[f.segmento_primario]=1; }        // penaliza o segmento no dia
        return;
      }
      var dias=RECUSA_DIAS[m]||30;
      var lim=new Date(); lim.setDate(lim.getDate()-dias);
      if(dx>=lim) REC.excl[x.documento]=1;
      if(m==="ticket_baixo"&&f){                                                  // aprende a faixa recusada, por categoria
        var c=categoria(f); if(c!=="comp"&&(f.valor_ref||0)>REC.ticketMax[c]) REC.ticketMax[c]=f.valor_ref||0;
      }
    });
  }
  function renderMetrics(){
    var c=function(b){return fila.filter(function(f){return f.bucket===b;}).length;};
    var adm=(u.role==="admin" && !selV.value);
    $("#metrics").innerHTML=
      (adm?'':'<div class="metric"><div class="lbl">Feitas hoje</div><div class="val" style="color:var(--green)">'+FEITAS+' / '+META+'</div></div>')
      +'<div class="metric"><div class="lbl">Na fila agora</div><div class="val">'+fila.length+'</div></div>'
      +'<div class="metric"><div class="lbl">Compromissos</div><div class="val" style="color:var(--red)">'+c(0)+'</div></div>'
      +'<div class="metric"><div class="lbl">Recompra / Reativar / Lead</div><div class="val" style="font-size:18px;">'+c(1)+' / '+(c(2)+c(4))+' / '+c(3)+'</div></div>';
  }
  function renderLista(){
    if(!fila.length){ $("#lista").innerHTML='<div class="empty">Fila zerada — você bateu a meta do dia. 👏</div>'; return; }
    $("#lista").innerHTML=fila.map(function(f){
      var b=BK[f.bucket]||["",""]; var w=waNum(f.celular);
      var skip=(f.bucket>=0 && f.bucket<=4)?'<button class="skip" title="Tirar da fila — e ensinar o programa por quê" onclick="agoraNao(\''+f.documento+'\',event,this)">agora não</button>':"";
      return '<div class="row '+(sel===f.documento?"sel":"")+'" onclick="abrirFicha(\''+f.documento+'\')">'
        +'<div class="main"><div class="nm">'+esc(f.empresa||f.documento)+'</div>'
        +'<div class="meta">'+esc(f.segmento_primario||"—")+' · '+esc(f.municipio||"")+(f.uf?"/"+f.uf:"")+' · '+brl(f.valor_ref)+'</div></div>'
        +'<span class="bk '+b[1]+'">'+b[0]+'</span>'
        +'<span>'+(w?'<a class="wa" href="https://wa.me/'+w+'" target="_blank" onclick="event.stopPropagation()">✦</a>':"")+'</span>'
        +skip+'</div>';
    }).join("");
  }
  // "Agora não": botão único — abre a janelinha de motivos logo abaixo dele.
  // "Só hoje" = adiamento simples (repõe e volta em SNOOZE_DIAS). Os demais ensinam o ranking.
  window.agoraNao=function(doc,ev,btn){
    if(ev) ev.stopPropagation();
    if(u.role==="admin" && !selV.value){ banner("Selecione um vendedor para usar a fila.","err"); return; }
    fecharPop();
    function opt(m,t,d){ return '<button class="mopt" onclick="popMotivo(\''+doc+'\',\''+m+'\')">'+t+'<div class="d">'+d+'</div></button>'; }
    var pop=document.createElement("div"); pop.className="pop"; pop.id="pop";
    pop.innerHTML='<div style="font-size:12px;color:var(--muted);margin:2px 4px 8px;">Por que agora não? Sua resposta ensina a fila.</div>'
      +opt('so_hoje','Só hoje','Adia por '+SNOOZE_DIAS+' dias e repõe com outra sugestão')
      +opt('timing_errado','Timing','Cliente bom, hora errada — some por '+RECUSA_DIAS.timing_errado+' dias')
      +opt('ticket_baixo','Valor baixo','Some por '+RECUSA_DIAS.ticket_baixo+' dias; valores parecidos descem no ranking')
      +opt('segmento_ruim_hoje','Segmento','Volta amanhã — o segmento desce no ranking de hoje')
      +opt('nao_quero_lead','Não quero atender','Nunca mais sugerir este cliente para você')
      +opt('outro_ui','Outros','Escreva o motivo — some por '+RECUSA_DIAS.outro+' dias')
      +'<div id="outroBox" style="display:none;padding:4px;"><input id="outroTxt" type="text" placeholder="Qual o motivo?" style="width:100%;">'
      +'<button class="btn blue" style="margin-top:6px;width:100%;" onclick="popOutroOk(\''+doc+'\')">Confirmar</button></div>';
    document.body.appendChild(pop);
    var r=btn.getBoundingClientRect();
    var top=r.bottom+6; if(top+330>window.innerHeight) top=Math.max(8,r.top-336);
    pop.style.top=top+"px";
    pop.style.left=Math.max(8,Math.min(window.innerWidth-278,r.right-264))+"px";
    setTimeout(function(){ document.addEventListener("click",fecharPopFora); },0);
  };
  window.fecharPop=function(){ var p=document.getElementById("pop"); if(p)p.remove(); document.removeEventListener("click",fecharPopFora); };
  function fecharPopFora(e){ var p=document.getElementById("pop"); if(p && !p.contains(e.target)) fecharPop(); }
  window.popMotivo=function(doc,m){
    if(m==="outro_ui"){ var b=document.getElementById("outroBox"); b.style.display="block"; document.getElementById("outroTxt").focus(); return; }
    if(m==="so_hoje"){ fecharPop(); adiar(doc); return; }
    fecharPop(); recusaMotivo(doc,m,null);
  };
  window.popOutroOk=function(doc){ var t=(document.getElementById("outroTxt").value||"").trim(); fecharPop(); recusaMotivo(doc,"outro",t||null); };
  // adiamento simples ("só hoje"): mantém o comportamento antigo do agora não
  window.adiar=async function(doc){
    var vend=(u.role==="admin"?selV.value:u.nome);
    removeReplace(doc,true);   // resposta imediata na tela
    var ins=await sb.from("va_interacoes").insert({documento:doc,vendedor:vend,resultado:"agora_nao",motivo:"so_hoje",canal:"fila"}).select("id");
    var id=(ins&&ins.data&&ins.data[0]&&ins.data[0].id)||null;
    showUndo(doc,id);
  };
  function showUndo(doc,id){
    var t=$("#toast"); if(!t) return;
    t.innerHTML='Adiado por '+SNOOZE_DIAS+' dias. <button onclick="desfazer(\''+(id||"")+'\')">desfazer</button>';
    t.classList.add("on"); clearTimeout(t._tmr); t._tmr=setTimeout(function(){ t.classList.remove("on"); },6000);
  }
  window.desfazer=async function(id){
    if(id) await sb.from("va_interacoes").delete().eq("id",id);
    $("#toast").classList.remove("on"); carregar();
  };
  window.recusaMotivo=async function(doc,motivo,nota){
    var vend=(u.role==="admin"?selV.value:u.nome);
    var f=fila[idxOf(doc)];
    // aprendizado imediato na sessão (o reload de amanhã reconstrói tudo do banco)
    if(motivo==="segmento_ruim_hoje" && f && f.segmento_primario) REC.segHoje[f.segmento_primario]=1;
    if(motivo==="ticket_baixo" && f){ var c=categoria(f); if(c!=="comp" && (f.valor_ref||0)>REC.ticketMax[c]) REC.ticketMax[c]=f.valor_ref||0; }
    REC.excl[doc]=1;
    removeReplace(doc,true);   // resposta imediata na tela, repõe mantendo a Mistura
    var ins=await sb.from("va_interacoes").insert({documento:doc,vendedor:vend,resultado:"recusado",motivo:motivo,nota:nota||null,canal:"fila"}).select("id");
    var id=(ins&&ins.data&&ins.data[0]&&ins.data[0].id)||null;
    var msg={ticket_baixo:"Recusado — some por "+RECUSA_DIAS.ticket_baixo+" dias.",nao_quero_lead:"Recusado — não será mais sugerido para você.",timing_errado:"Recusado — some por "+RECUSA_DIAS.timing_errado+" dias.",segmento_ruim_hoje:"Recusado — volta amanhã.",outro:"Recusado — some por "+RECUSA_DIAS.outro+" dias."}[motivo]||"Recusado.";
    var t=$("#toast");
    t.innerHTML=msg+' <button onclick="desfazer(\''+(id||"")+'\')">desfazer</button>';
    t.classList.add("on"); clearTimeout(t._tmr); t._tmr=setTimeout(function(){ t.classList.remove("on"); },6000);
  };
  window.abrirFicha=async function(doc){
    sel=doc; renderLista(); $("#fichaVazia").style.display="none"; $("#ficha").style.display="block";
    $("#ficha").innerHTML='<div class="empty">Carregando…</div>';
    var r=await sb.from("vw_ficha_cliente").select("*").eq("documento",doc).limit(1);
    if(r.error||!r.data||!r.data.length){ $("#ficha").innerHTML='<div class="empty">Não foi possível abrir.</div>'; return; }
    var f=r.data[0]; currentFicha=f;
    var ini=(f.empresa||"?").trim().slice(0,2).toUpperCase(); var tent=f.tentativas||0;
    var st=["lead","prospect","cliente","venda_digital","nao_atendeu","mala_direta","encerrado"];
    $("#ficha").innerHTML=
      '<div class="fhead"><div class="avatar">'+esc(ini)+'</div><div style="flex:1;min-width:0;"><div class="nm" style="font-size:16px;font-weight:600;">'+esc(f.empresa||f.nome||f.documento)+'</div>'
      +'<div style="font-size:12px;color:var(--muted);">'+(f.pessoa_contato?esc(f.pessoa_contato)+" · ":"")+esc(f.municipio||"")+(f.uf?"/"+f.uf:"")+'</div></div>'
      +'<span class="tag">'+esc(f.status||"")+'</span><span class="tag">'+esc(f.segmento_primario||"")+'</span></div>'
      +'<div class="phones">'+(f.celular?'<a class="pri" href="https://wa.me/'+waNum(f.celular)+'" target="_blank">✆ '+esc(f.celular)+'</a>':'<span class="alt">sem celular</span>')
      +(f.telefone?'<span class="alt">tel: '+esc(f.telefone)+'</span>':"")+(f.email?'<span class="alt">'+esc(f.email)+'</span>':"")+'</div>'
      +'<div class="two"><div class="sec"><div class="t">Compras</div><div class="c">Última: '+esc(f.ultima_compra||"—")+'<br>12 meses: '+brl(f.total_12m)+'<br>Total: '+brl(f.total_all)+'<br>Pedidos: '+(f.n_pedidos||"—")+'</div></div>'
      +'<div class="sec"><div class="t">Top produtos</div><div class="c">'+esc(f.top_prod5||f.razao_social||"—")+'</div></div></div>'
      +'<div class="inputs"><div class="cap">Só isto você registra</div><div class="ig">'
      +'<div><div class="l">Tentativas até falar</div><div class="stepper"><button onclick="bump(-1)">−</button><span class="n" id="att">'+tent+'</span><button onclick="bump(1)">+</button></div></div>'
      +'<div><div class="l">Próxima ligação (vira compromisso)</div><input id="prox" type="date" value="'+(f.proxima_data||"")+'"></div>'
      +'<div><div class="l">Lembrete</div><input id="lemb" type="text" placeholder="ex.: pediu cotação" value="'+esc(f.lembrete||"")+'"></div>'
      +'<div><div class="l">Formato do contato</div><div class="chips" style="margin-top:2px;" id="fmtChips">'
      +["voz","whatsapp","ambos"].map(function(s){return '<button class="chip" onclick="setFmt(this,\''+s+'\')">'+s+'</button>';}).join("")
      +'</div></div></div></div>'
      +'<div style="margin-top:13px;border-top:1px solid var(--border);padding-top:10px;"><div style="font-size:12px;color:var(--muted2);">Situação</div><div class="chips">'
      +st.map(function(s){return '<button class="chip '+(f.status===s?"on":"")+'" onclick="setStatus(this,\''+s+'\')">'+s+'</button>';}).join("")+'</div></div>'
      +'<div class="fa"><button class="btn blue" onclick="verDetalhes()">Ver tudo</button><button class="btn green" onclick="salvar(\''+doc+'\')">Salvar registro</button><span class="saved" id="savedMsg">✓ salvo</span></div>';
    $("#ficha").dataset.status=f.status||"";
    $("#ficha").dataset.formato="";
  };
  window.bump=function(n){ var e=$("#att"); e.textContent=Math.max(0,(parseInt(e.textContent)||0)+n); };
  window.setStatus=function(btn,s){ document.querySelectorAll(".chips .chip").forEach(function(c){ if(!c.closest("#fmtChips")) c.classList.remove("on"); }); btn.classList.add("on"); $("#ficha").dataset.status=s; };
  // formato do contato: voz | whatsapp | ambos (opcional — clique de novo para desmarcar)
  window.setFmt=function(btn,s){
    var on=btn.classList.contains("on");
    document.querySelectorAll("#fmtChips .chip").forEach(function(c){c.classList.remove("on");});
    if(!on){ btn.classList.add("on"); $("#ficha").dataset.formato=s; } else { $("#ficha").dataset.formato=""; }
  };
  window.salvar=async function(doc){
    var tent=parseInt($("#att").textContent)||0, prox=$("#prox").value||null, lemb=$("#lemb").value||null, status=$("#ficha").dataset.status||null;
    var upd={tentativas:tent,lembrete:lemb,proxima_data:prox,status:status,atualizado_em:new Date().toISOString()};
    if(prox) upd.compromisso=true;
    var r=await sb.from("va_cliente_status").update(upd).eq("documento",doc);
    if(r.error){ banner("Erro ao salvar: "+r.error.message,"err"); return; }
    var fmt=$("#ficha").dataset.formato||null;
    await sb.from("va_interacoes").insert({documento:doc,vendedor:(u.role==="admin"?selV.value:u.nome),resultado:status,tentativas_no_contato:tent,nota:lemb,canal:"fila",formato:fmt});
    var m=$("#savedMsg"); m.classList.add("on"); setTimeout(function(){m.classList.remove("on");},1500);
    banner("Registro salvo.","ok"); setTimeout(function(){banner("");},1600);
    // contato registrado = 1 sugestão FEITA. Sai da fila e NÃO é reposto (a meta do dia diminui).
    FEITAS++; removeReplace(doc,false);
  };
  window.verDetalhes=function(){
    var f=currentFicha; if(!f) return;
    $("#mTitle").textContent=f.empresa||f.nome||f.documento;
    $("#mBody").innerHTML='<div class="kv">'
      +'<b>Documento</b> '+esc(f.documento)+' ('+esc(f.tipo_doc||"")+')<br><b>Origem</b> '+esc(f.origem||"—")+' · pool '+esc(f.pool||"—")+'<br>'
      +'<b>Vendedor</b> '+esc(f.vendedor_dono||"(não atribuído)")+'<br><b>Segmento</b> '+esc(f.segmento_primario||"—")+'<br>'
      +'<b>Contato</b> '+esc(f.pessoa_contato||"—")+'<br><b>Celular</b> '+esc(f.celular||"—")+' &nbsp; <b>Tel</b> '+esc(f.telefone||"—")+'<br>'
      +'<b>E-mail</b> '+esc(f.email||"—")+'<br><b>Cidade/UF</b> '+esc(f.municipio||"—")+(f.uf?"/"+f.uf:"")+'<br>'
      +'<b>Última compra</b> '+esc(f.ultima_compra||"—")+'<br><b>Próxima (sugerida)</b> '+esc(f.proxima_data||"—")+'<br>'
      +'<b>Compras 3/6/12m</b> '+brl(f.total_3m)+' / '+brl(f.total_6m)+' / '+brl(f.total_12m)+'<br>'
      +'<b>Total histórico</b> '+brl(f.total_all)+' · '+(f.n_pedidos||"—")+' pedidos<br><b>Top produtos</b> '+esc(f.top_prod5||"—")+'<br>'
      +'<b>Razão social</b> '+esc(f.razao_social||"—")+'<br><b>Atividade (CNAE)</b> '+esc(f.atividade_principal||"—")+'<br>'
      +'<b>Porte</b> '+esc(f.porte||"—")+(f.num_empregados?" · "+f.num_empregados+" func.":"")+'<br><b>Site</b> '+esc(f.url_empresa||"—")+'</div>';
    $("#overlay").classList.add("on");
  };
  window.fecharModal=function(){ $("#overlay").classList.remove("on"); };
  document.addEventListener("keydown",function(e){ if(e.key==="Escape"){ fecharModal(); fecharPop(); } });
  var qtmr=null;
  $("#q").addEventListener("input",function(){
    clearTimeout(qtmr); var v=this.value.trim(); if(v.length<2) return;
    qtmr=setTimeout(async function(){
      var r=await sb.from("vw_ficha_cliente").select("documento,empresa,segmento_primario,municipio,uf,celular,total_all").ilike("empresa","%"+v+"%").limit(25);
      if(r.error) return;
      fila=(r.data||[]).map(function(d){ d.bucket=9; d.valor_ref=d.total_all; return d; });
      $("#sub").textContent='Busca: "'+v+'"'; renderLista();
    },350);
  });
  $("#selSeg").addEventListener("change",carregar);
  if(u.role==="admin") selV.addEventListener("change",carregar);
  (async function(){ try{ var p=await sb.from("va_parametros").select("chave,valor"); (p.data||[]).forEach(function(x){ PARAMS[x.chave]=x.valor; }); }catch(e){} carregar(); })();
}
</script>
</body>
